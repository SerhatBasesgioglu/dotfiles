# AeroSpace window manager configuration (config format v2).
config-version = 2
start-at-login = true
auto-reload-config = true

# Keep the default tiled layout; switch to accordion temporarily with the bindings below.
default-root-container-layout = 'tiles'

[mode.main.binding]
# Focus a window in the indicated direction.
ctrl-alt-h = 'focus left'
ctrl-alt-j = 'focus down'
ctrl-alt-k = 'focus up'
ctrl-alt-l = 'focus right'

# Cycle through windows, wrapping around at the end.
ctrl-alt-tab = 'focus --wrap-around dfs-next'
ctrl-alt-shift-tab = 'focus --wrap-around dfs-prev'

# Move the focused window in the indicated direction.
ctrl-alt-shift-h = 'move left'
ctrl-alt-shift-j = 'move down'
ctrl-alt-shift-k = 'move up'
ctrl-alt-shift-l = 'move right'

# Switch to workspaces 1–5, or move the focused window there.
ctrl-alt-1 = 'workspace 1'
ctrl-alt-2 = 'workspace 2'
ctrl-alt-3 = 'workspace 3'
ctrl-alt-4 = 'workspace 4'
ctrl-alt-5 = 'workspace 5'
ctrl-alt-shift-1 = 'move-node-to-workspace 1'
ctrl-alt-shift-2 = 'move-node-to-workspace 2'
ctrl-alt-shift-3 = 'move-node-to-workspace 3'
ctrl-alt-shift-4 = 'move-node-to-workspace 4'
ctrl-alt-shift-5 = 'move-node-to-workspace 5'

# Choose a layout for the current workspace.
ctrl-alt-slash = 'layout tiles'
ctrl-alt-comma = 'layout accordion'
