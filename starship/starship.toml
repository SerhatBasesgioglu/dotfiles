format = """
$username\
$hostname\
$directory\
$python\
$git_branch\
$git_status\
$cuda\
$docker_context\
$time\
$character"""

[os]
disabled = true

[username]
show_always = true
style_user = "fg:#8ec07c"
style_root = "fg:#fb4934"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "fg:#83a598"
format = "@[$hostname]($style)"

[directory]
style = "fg:#e0e0e0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[python]
style = "fg:#fabd2f"
format = "[ $virtualenv ]($style)"

[git_branch]
symbol = ""
style = "fg:#e0e0e0"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "fg:#e0e0e0"
format = '[$all_status$ahead_behind]($style)'

[time]
disabled = false
time_format = "%H:%M"
style = "fg:#e0e0e0"
format = "[ $time ]($style)"

[character]
success_symbol = "[❯](bold fg:#e0e0e0)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold fg:#e0e0e0)"

[cmd_duration]
show_milliseconds = false
min_time = 2000
style = "fg:#e0e0e0"
