format = """
[](#585858)\
$os\
$username\
$hostname\
[](bg:#585858 fg:#585858)\
$directory\
[](fg:#585858 bg:#585858)\
$git_branch\
$git_status\
[](fg:#585858 bg:#585858)\
$cuda\
$docker_context\
[](fg:#585858 bg:#585858)\
$time\
[](fg:#585858)\
$line_break\
$character"""

[os]
disabled = false
style = "bg:#585858 fg:#e0e0e0"

[username]
show_always = true
style_user = "bg:#585858 fg:#e0e0e0"
style_root = "bg:#585858 fg:#e0e0e0"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bg:#585858 fg:#e0e0e0"
format = "@[$hostname]($style)"

[directory]
style = "bg:#585858 fg:#e0e0e0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#585858 fg:#e0e0e0"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:#585858 fg:#e0e0e0"
format = '[$all_status$ahead_behind]($style)'

[time]
disabled = false
time_format = "%H:%M"
style = "bg:#585858 fg:#e0e0e0"
format = "[ $time ]($style)"

[character]
success_symbol = "[❯](bold fg:#e0e0e0)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold fg:#e0e0e0)"

[cmd_duration]
show_milliseconds = false
min_time = 2000
style = "fg:#e0e0e0"
